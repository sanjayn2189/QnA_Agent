<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConfluenceAssist — Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0f0f13;
            --bg-secondary: #1a1a24;
            --bg-chat: #14141c;
            --bg-input: #1e1e2e;
            --bg-user: #2d2b55;
            --bg-bot: #1e1e2e;
            --accent: #7c6aef;
            --accent-hover: #9580ff;
            --text-primary: #e2e0f0;
            --text-secondary: #8b87a5;
            --text-muted: #5a5677;
            --border: #2a2940;
            --success: #50e3a4;
            --shadow: 0 4px 24px rgba(0,0,0,0.4);
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Header ───────────────────────────── */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        .header-icon {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, var(--accent), #a78bfa);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
        }
        .header-text h1 {
            font-size: 16px; font-weight: 600;
            background: linear-gradient(90deg, var(--text-primary), var(--accent-hover));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .header-text p {
            font-size: 11px; color: var(--text-muted); margin-top: 2px;
        }
        .status-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--success); margin-left: auto;
            box-shadow: 0 0 8px rgba(80, 227, 164, 0.5);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* ── Chat Container ───────────────────── */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }
        .chat-container::-webkit-scrollbar { width: 6px; }
        .chat-container::-webkit-scrollbar-track { background: transparent; }
        .chat-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        /* ── Messages ─────────────────────────── */
        .message {
            max-width: 720px;
            display: flex;
            gap: 12px;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .message.bot { align-self: flex-start; }

        .message-avatar {
            width: 32px; height: 32px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; flex-shrink: 0;
        }
        .message.user .message-avatar {
            background: var(--bg-user);
        }
        .message.bot .message-avatar {
            background: linear-gradient(135deg, var(--accent), #a78bfa);
        }

        .message-content {
            padding: 14px 18px;
            border-radius: 16px;
            line-height: 1.6;
            font-size: 14px;
        }
        .message.user .message-content {
            background: var(--bg-user);
            border-bottom-right-radius: 4px;
            color: #d4d0f0;
        }
        .message.bot .message-content {
            background: var(--bg-bot);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        /* Markdown-like styles inside bot messages */
        .message.bot .message-content h3 { font-size: 14px; font-weight: 600; margin: 12px 0 6px; color: var(--accent-hover); }
        .message.bot .message-content h3:first-child { margin-top: 0; }
        .message.bot .message-content ul, .message.bot .message-content ol { padding-left: 20px; margin: 6px 0; }
        .message.bot .message-content li { margin: 3px 0; }
        .message.bot .message-content code { background: #282840; padding: 2px 6px; border-radius: 4px; font-size: 13px; font-family: 'SF Mono', monospace; }
        .message.bot .message-content strong { color: var(--accent-hover); font-weight: 600; }
        .message.bot .message-content a { color: var(--accent-hover); text-decoration: none; }
        .message.bot .message-content a:hover { text-decoration: underline; }

        .sources a:hover { text-decoration: underline; }

        /* Stats */
        .stats-container {
            margin-top: 10px;
            padding-top: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 10px;
            color: var(--text-muted);
            border-top: 1px dashed var(--border);
        }
        .stat-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .stat-label { 
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        /* Typing indicator */
        .typing-indicator {
            display: flex; gap: 4px; padding: 8px 0;
        }
        .typing-indicator span {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--text-muted);
            animation: bounce 1.4s infinite;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
        }

        /* Welcome */
        .welcome {
            text-align: center;
            margin: auto;
            max-width: 480px;
            padding: 40px 20px;
        }
        .welcome-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        .welcome h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
            background: linear-gradient(90deg, var(--text-primary), var(--accent-hover));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .welcome p {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .suggestions {
            display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
        }
        .suggestion-btn {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }
        .suggestion-btn:hover {
            border-color: var(--accent);
            color: var(--text-primary);
            background: rgba(124, 106, 239, 0.1);
        }

        /* ── Input Area ───────────────────────── */
        .input-area {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            padding: 16px 24px;
            flex-shrink: 0;
        }
        .input-wrapper {
            max-width: 760px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .input-wrapper input {
            flex: 1;
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-wrapper input:focus {
            border-color: var(--accent);
        }
        .input-wrapper input::placeholder {
            color: var(--text-muted);
        }
        .send-btn {
            background: linear-gradient(135deg, var(--accent), #a78bfa);
            border: none;
            color: white;
            width: 44px; height: 44px;
            border-radius: 12px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.15s, opacity 0.15s;
            flex-shrink: 0;
        }
        .send-btn:hover { transform: scale(1.05); }
        .send-btn:active { transform: scale(0.95); }
        .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .send-btn svg { width: 20px; height: 20px; }

        .footer-text {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-icon">🧠</div>
        <div class="header-text">
            <h1>ConfluenceAssist</h1>
            <p>Enterprise Q&A over Confluence</p>
        </div>
        <div class="status-dot" title="Connected"></div>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="welcome" id="welcome">
            <div class="welcome-icon">💬</div>
            <h2>Ask anything from Confluence</h2>
            <p>I can answer questions based on your organization's Confluence knowledge base. Try one of these:</p>
            <div class="suggestions">
                <button class="suggestion-btn" onclick="askSuggestion(this)">What is the remote work policy?</button>
                <button class="suggestion-btn" onclick="askSuggestion(this)">Tell me about employee onboarding</button>
                <button class="suggestion-btn" onclick="askSuggestion(this)">What are the leave policies?</button>
                <button class="suggestion-btn" onclick="askSuggestion(this)">Explain the training programs</button>
            </div>
        </div>
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <input type="text" id="queryInput" placeholder="Ask a question..." autocomplete="off"
                   onkeydown="if(event.key==='Enter') sendMessage()">
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
        <div class="footer-text">V1 MVP · Powered by LangGraph + Groq LLaMA-3.3</div>
    </div>

    <script>
        const SESSION_ID = crypto.randomUUID();
        const chatContainer = document.getElementById('chatContainer');
        const queryInput = document.getElementById('queryInput');
        const sendBtn = document.getElementById('sendBtn');
        const welcome = document.getElementById('welcome');

        function askSuggestion(btn) {
            queryInput.value = btn.textContent;
            sendMessage();
        }

        function addMessage(text, type, sources, metadata) {
            if (welcome) welcome.style.display = 'none';

            const msg = document.createElement('div');
            msg.className = `message ${type}`;

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = type === 'user' ? '👤' : '🧠';

            const content = document.createElement('div');
            content.className = 'message-content';

            // Simple markdown-ish rendering
            let html = text
                .replace(/### (.+)/g, '<h3>$1</h3>')
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.+?)\*/g, '<em>$1</em>')
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\n- /g, '\n• ')
                .replace(/\n\n/g, '<br><br>')
                .replace(/\n/g, '<br>');
            content.innerHTML = html;

            // Add sources
            if (sources && sources.length > 0) {
                const srcDiv = document.createElement('div');
                srcDiv.className = 'sources';
                srcDiv.innerHTML = '📄 Sources: ' + sources.map(s =>
                    s.url ? `<a href="${s.url}" target="_blank">${s.title}</a>` : s.title
                ).join(' · ');
                content.appendChild(srcDiv);
            }

            // Add performance metadata
            if (metadata && type === 'bot') {
                const statsDiv = document.createElement('div');
                statsDiv.className = 'stats-container';
                
                const items = [
                    { label: 'Chunks', value: metadata.retrieval_count || 0 },
                    { label: 'Retrieval', value: `${(metadata.retrieval_time || 0).toFixed(2)}s` },
                    { label: 'Grading', value: `${(metadata.grading_time || 0).toFixed(2)}s` },
                    { label: 'Generation', value: `${(metadata.generation_time || 0).toFixed(2)}s` },
                    { label: 'Total', value: `${(metadata.total_time || 0).toFixed(2)}s` }
                ];

                if (metadata.confidence_score !== undefined && metadata.confidence_score !== null) {
                    const score = metadata.confidence_score;
                    let color = 'var(--text-muted)';
                    if (score >= 80) color = '#50e3a4'; // Success green
                    else if (score >= 50) color = '#ffb86c'; // Warning orange
                    else color = '#ff5555'; // Error red
                    
                    items.push({ 
                        label: 'Confidence', 
                        value: `<span style="color: ${color}; font-weight: bold;">${score}%</span>` 
                    });
                }

                statsDiv.innerHTML = items.map(item => 
                    `<div class="stat-item"><span class="stat-label">${item.label}:</span> ${item.value}</div>`
                ).join('');
                content.appendChild(statsDiv);
            }

            msg.appendChild(avatar);
            msg.appendChild(content);
            chatContainer.appendChild(msg);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return msg;
        }

        function addTyping() {
            const msg = document.createElement('div');
            msg.className = 'message bot';
            msg.id = 'typing';

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = '🧠';

            const content = document.createElement('div');
            content.className = 'message-content';
            content.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';

            msg.appendChild(avatar);
            msg.appendChild(content);
            chatContainer.appendChild(msg);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function removeTyping() {
            const el = document.getElementById('typing');
            if (el) el.remove();
        }

        async function sendMessage() {
            const query = queryInput.value.trim();
            if (!query) return;

            queryInput.value = '';
            sendBtn.disabled = true;

            addMessage(query, 'user');
            addTyping();

            try {
                const res = await fetch('/api/v1/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query, session_id: SESSION_ID }),
                });
                const data = await res.json();
                removeTyping();

                if (res.ok) {
                    addMessage(data.answer, 'bot', data.sources, data.metadata);
                } else {
                    addMessage('⚠️ Error: ' + (data.detail || 'Something went wrong'), 'bot');
                }
            } catch (err) {
                removeTyping();
                addMessage('⚠️ Could not reach the server. Is it running?', 'bot');
            }

            sendBtn.disabled = false;
            queryInput.focus();
        }

        queryInput.focus();
    </script>
</body>
</html>
